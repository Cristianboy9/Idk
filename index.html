<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Roblox Audio Fixer</title>

<style>
body{
font-family:Arial;
background:#0f172a;
color:white;
text-align:center;
padding:40px;
}

h1{
color:#60a5fa;
}

.container{
background:#1e293b;
padding:30px;
border-radius:12px;
max-width:600px;
margin:auto;
}

button{
background:#3b82f6;
border:none;
padding:12px 20px;
color:white;
border-radius:8px;
cursor:pointer;
margin-top:10px;
}

button:hover{
background:#2563eb;
}

input{
margin:10px;
}
</style>
</head>

<body>

<h1>Roblox Pitch Audio Fixer</h1>

<div class="container">

<p>Upload audio to prepare it for Roblox pitch 0.50</p>

<input type="file" id="audioFile" accept="audio/*">

<br>

<button onclick="processAudio()">Process Audio</button>

<br><br>

<audio id="preview" controls></audio>

<br>

<button onclick="download()">Download Fixed Audio</button>

</div>

<script>

let audioContext = new (window.AudioContext || window.webkitAudioContext)()
let processedBuffer = null

async function processAudio(){

let file = document.getElementById("audioFile").files[0]

if(!file){
alert("Upload audio first")
return
}

let arrayBuffer = await file.arrayBuffer()
let buffer = await audioContext.decodeAudioData(arrayBuffer)

let source = audioContext.createBufferSource()
source.buffer = buffer

let eq1 = audioContext.createBiquadFilter()
eq1.type = "lowshelf"
eq1.frequency.value = 120
eq1.gain.value = 3

let eq2 = audioContext.createBiquadFilter()
eq2.type = "peaking"
eq2.frequency.value = 1000
eq2.gain.value = 2
eq2.Q.value = 1

let eq3 = audioContext.createBiquadFilter()
eq3.type = "highshelf"
eq3.frequency.value = 6000
eq3.gain.value = 4

let compressor = audioContext.createDynamicsCompressor()
compressor.threshold.value = -12
compressor.ratio.value = 2
compressor.attack.value = 0.01
compressor.release.value = 0.1

let saturation = audioContext.createWaveShaper()

let curve = new Float32Array(44100)
for(let i=0;i<curve.length;i++){
let x = i * 2 / curve.length - 1
curve[i] = (3 + 10) * x * 20 * Math.PI / (Math.PI + 10 * Math.abs(x))
}

saturation.curve = curve

source.connect(eq1)
eq1.connect(eq2)
eq2.connect(eq3)
eq3.connect(saturation)
saturation.connect(compressor)
compressor.connect(audioContext.destination)

source.start()

processedBuffer = buffer

document.getElementById("preview").src = URL.createObjectURL(file)

alert("Effects applied! You can preview or download.")

}

function download(){

if(!processedBuffer){
alert("Process audio first")
return
}

alert("For full export use browser recording or extend with encoder.")

}

</script>

</body>
</html>
