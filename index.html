<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Roblox Audio Effect Fixer</title>

<script src="https://unpkg.com/tone@14.7.77/build/Tone.js"></script>

<style>
body{
font-family:Arial;
background:#0f172a;
color:white;
text-align:center;
padding:40px;
}

.container{
background:#1e293b;
padding:30px;
border-radius:12px;
max-width:600px;
margin:auto;
}

button{
background:#3b82f6;
border:none;
padding:12px 20px;
color:white;
border-radius:8px;
cursor:pointer;
margin:10px;
}
</style>
</head>

<body>

<h1>Roblox Audio Effect Fixer</h1>

<div class="container">

<input type="file" id="file">

<br>

<button onclick="process()">Apply Effects</button>

<br><br>

<audio id="player" controls></audio>

</div>

<script>

let player = document.getElementById("player")

async function process(){

const file = document.getElementById("file").files[0]
if(!file) return alert("Upload audio")

const url = URL.createObjectURL(file)

await Tone.start()

const playerTone = new Tone.Player(url)

const eq = new Tone.EQ3({
low:3,
mid:2,
high:4,
lowFrequency:120,
highFrequency:6000
})

const saturator = new Tone.Distortion(0.1)

const compressor = new Tone.Compressor({
ratio:2,
threshold:-12
})

playerTone.chain(eq,saturator,compressor,Tone.Destination)

playerTone.start()

player.src = url

}

</script>

</body>
</html>
