<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>THE LOUDEST ROBLOX TOOL 2.5x</title>
    <style>
        body { font-family: 'Courier New', monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #000; color: #0f0; margin: 0; }
        .box { border: 3px solid #0f0; padding: 30px; border-radius: 10px; text-align: center; box-shadow: 0 0 20px #0f0; width: 380px; }
        h1 { font-size: 1.8rem; text-shadow: 2px 2px #000; }
        .warning { color: #f00; font-size: 0.7rem; margin-bottom: 20px; font-weight: bold; }
        .loud-option { background: #111; padding: 15px; border-radius: 5px; margin: 20px 0; border: 1px dashed #0f0; }
        input[type="checkbox"] { transform: scale(1.8); cursor: pointer; }
        button { background: #0f0; color: #000; border: none; padding: 15px; cursor: pointer; font-weight: bold; width: 100%; display: none; font-size: 1.1rem; }
        #status { margin-top: 20px; color: #fff; }
    </style>
</head>
<body>

<div class="box">
    <h1>LOUD PREP (2.5x)</h1>
    <div class="warning">¡CUIDADO! EL MODO LOUD PUEDE DAÑAR OÍDOS</div>
    
    <input type="file" id="upload" accept="audio/*">

    <div class="loud-option">
        <label><input type="checkbox" id="loudCheck"> MODO LOUDEST (BYPASS) 🔥</label>
    </div>

    <button id="downloadBtn">GENERAR AUDIO PARA ROBLOX</button>
    <div id="status">Esperando archivo...</div>
</div>

<script>
    const upload = document.getElementById('upload');
    const downloadBtn = document.getElementById('downloadBtn');
    const loudCheck = document.getElementById('loudCheck');
    const status = document.getElementById('status');
    let audioBuffer;

    upload.onchange = async (e) => {
        const file = e.target.files;
        if (!file) return;
        status.innerText = "Decodificando...";
        const arrayBuffer = await file.arrayBuffer();
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
        status.innerText = "¡Audio listo!";
        downloadBtn.style.display = "block";
    };

    downloadBtn.onclick = () => {
        const offlineCtx = new OfflineAudioContext(
            audioBuffer.numberOfChannels,
            audioBuffer.length / 2.5,
            audioBuffer.sampleRate
        );

        const source = offlineCtx.createBufferSource();
        source.buffer = audioBuffer;
        source.playbackRate.value = 2.5;

        // --- SISTEMA DE MAXIMIZACIÓN ---
        const compressor = offlineCtx.createDynamicsCompressor();
        const gainNode = offlineCtx.createGain();

        if (loudCheck.checked) {
            // Configuramos el compresor para "aplastar" el audio al máximo (LOUD)
            compressor.threshold.value = -50; // Detecta casi todo el sonido
            compressor.knee.value = 0;        // Curva dura
            compressor.ratio.value = 20;      // Compresión extrema
            compressor.attack.value = 0;      // Instantáneo
            compressor.release.value = 0.1;

            gainNode.gain.value = 15.0; // Multiplicador de volumen masivo
        } else {
            gainNode.gain.value = 1.5;
        }

        source.connect(compressor);
        compressor.connect(gainNode);
        gainNode.connect(offlineCtx.destination);
        // -------------------------------

        source.start();
        status.innerText = "Maximizando volumen...";

        offlineCtx.startRendering().then(renderedBuffer => {
            const wavBlob = bufferToWave(renderedBuffer, renderedBuffer.length);
            const url = URL.createObjectURL(wavBlob);
            const a = document.createElement('a');
            a.href = url;
            a.download = "ULTRA_LOUD_2.5x.wav";
            a.click();
            status.innerText = "¡Descargado! Ponlo en Pitch 0.4 en Roblox.";
        });
    };

    function bufferToWave(abuffer, len) {
        let numOfChan = abuffer.numberOfChannels, length = len * numOfChan * 2 + 44, buffer = new ArrayBuffer(length), view = new DataView(buffer), pos = 0;
        function setUint16(d) { view.setUint16(pos, d, true); pos += 2; }
        function setUint32(d) { view.setUint32(pos, d, true); pos += 4; }
        setUint32(0x46464952); setUint32(length - 8); setUint32(0x45564157);
        setUint32(0x20746d66); setUint32(16); setUint16(1); setUint16(numOfChan);
        setUint32(abuffer.sampleRate); setUint32(abuffer.sampleRate * 2 * numOfChan);
        setUint16(numOfChan * 2); setUint16(16); setUint32(0x61746164); setUint32(length - pos - 4);
        for (let i = 0; i < len; i++) {
            for (let channel = 0; channel < numOfChan; channel++) {
                let s = Math.max(-1, Math.min(1, abuffer.getChannelData(channel)[i]));
                view.setInt16(pos, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
                pos += 2;
            }
        }
        return new Blob([buffer], { type: "audio/wav" });
    }
</script>
</body>
</html>
