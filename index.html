<!DOCTYPE html>
<html lang="es">
<head>
    <title>Roblox Audio Processor</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; text-align: center; padding: 50px; }
        .box { border: 2px dashed #444; padding: 20px; border-radius: 10px; display: inline-block; }
        input, button { margin: 10px; cursor: pointer; }
        .controls { margin-top: 20px; display: flex; flex-direction: column; align-items: center; }
    </style>
</head>
<body>

    <h1>Bypass/Hypass Sound Maker</h1>
    <div class="box">
        <input type="file" id="audioFile" accept="audio/*">
        <div class="controls">
            <label>Distorsión (Saturación): <input type="range" id="dist" min="0" max="100" value="80"></label>
            <label>Filtro High Pass (Hz): <input type="range" id="hpf" min="500" max="5000" value="2000"></label>
            <button onclick="processAudio()">Reproducir con Efecto</button>
        </div>
    </div>

    <script>
        let audioCtx, source, distortion, biquadFilter;

        function processAudio() {
            const file = document.getElementById('audioFile').files[0];
            if (!file) return alert("Sube un audio primero");

            if (audioCtx) audioCtx.close();
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            const reader = new FileReader();
            reader.onload = async (e) => {
                const buffer = await audioCtx.decodeAudioData(e.target.result);
                
                source = audioCtx.createBufferSource();
                source.buffer = buffer;

                // 1. Crear Distorsión (WaveShaper)
                distortion = audioCtx.createWaveShaper();
                distortion.curve = makeDistortionCurve(document.getElementById('dist').value * 10);
                distortion.oversample = '4x';

                // 2. Crear Filtro High Pass (Corta bajos)
                biquadFilter = audioCtx.createBiquadFilter();
                biquadFilter.type = "highpass";
                biquadFilter.frequency.value = document.getElementById('hpf').value;

                // Conectar: Source -> Distorsión -> Filtro -> Salida
                source.connect(distortion);
                distortion.connect(biquadFilter);
                biquadFilter.connect(audioCtx.destination);

                source.start();
            };
            reader.readAsArrayBuffer(file);
        }

        // Algoritmo matemático para saturar la onda
        function makeDistortionCurve(amount) {
            const k = typeof amount === 'number' ? amount : 50;
            const n_samples = 44100;
            const curve = new Float32Array(n_samples);
            const deg = Math.PI / 180;
            for (let i = 0; i < n_samples; ++i) {
                const x = (i * 2) / n_samples - 1;
                curve[i] = (3 + k) * x * 20 * deg / (Math.PI + k * Math.abs(x));
            }
            return curve;
        }
    </script>
</body>
</html>
