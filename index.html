<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Roblox Audio FX</title>

<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.6/dist/ffmpeg.min.js"></script>

<style>
body{
font-family:Arial;
background:#0f172a;
color:white;
text-align:center;
padding:40px;
}

button{
padding:12px 20px;
background:#3b82f6;
border:none;
border-radius:8px;
color:white;
cursor:pointer;
margin:10px;
}
</style>
</head>

<body>

<h1>Roblox Audio Effect Processor</h1>

<input type="file" id="audio">

<br>

<button onclick="process()">Process Audio</button>

<br><br>

<a id="download"></a>

<script>

const { createFFmpeg, fetchFile } = FFmpeg
const ffmpeg = createFFmpeg({ log: true })

async function process(){

const file = document.getElementById("audio").files[0]
if(!file) return alert("Upload audio")

if(!ffmpeg.isLoaded()) await ffmpeg.load()

ffmpeg.FS("writeFile","input.mp3", await fetchFile(file))

await ffmpeg.run(
"-i","input.mp3",
"-af",
"equalizer=f=120:t=q:w=1:g=3,equalizer=f=1000:t=q:w=1:g=2,equalizer=f=6000:t=q:w=1:g=4,acompressor=threshold=-12dB:ratio=2",
"output.mp3"
)

const data = ffmpeg.FS("readFile","output.mp3")

const url = URL.createObjectURL(new Blob([data.buffer],{type:"audio/mp3"}))

const a = document.getElementById("download")
a.href = url
a.download = "roblox_fixed_audio.mp3"
a.innerText = "Download processed audio"

}

</script>

</body>
</html>
